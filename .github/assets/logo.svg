<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0c1829" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Glow / Neon Aura -->
  <path d="M128 20 C180 20 220 38 220 38 C220 134 180 200 128 238 C76 200 36 134 36 38 C36 38 76 20 128 20 Z"
        fill="#00f2fe" opacity="0.35" filter="url(#glow)" />

  <!-- Main Shield Body with vibrant electric border -->
  <path d="M128 22 C178 22 216 39 216 39 C216 132 176 196 128 234 C80 196 40 132 40 39 C40 39 78 22 128 22 Z"
        fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Inner Chamber -->
  <path d="M128 32 C170 32 202 46 202 46 C202 126 168 182 128 218 C88 182 54 126 54 46 C54 46 86 32 128 32 Z"
        fill="#091322" fill-opacity="0.95" stroke="#1e3a5f" stroke-width="2.5" />

  <!-- Server Stack / Telemetry Grid -->
  <!-- Server Unit 1 -->
  <rect x="74" y="66" width="108" height="24" rx="4" fill="#0c1829" stroke="#1e3a5f" stroke-width="1.5" />
  <circle cx="86" cy="78" r="3.5" fill="#00ff88" />
  <circle cx="96" cy="78" r="3.5" fill="#00f2fe" />
  <line x1="112" y1="78" x2="168" y2="78" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Server Unit 2 -->
  <rect x="74" y="98" width="108" height="24" rx="4" fill="#0c1829" stroke="#1e3a5f" stroke-width="1.5" />
  <circle cx="86" cy="110" r="3.5" fill="#00ff88" />
  <circle cx="96" cy="110" r="3.5" fill="#00f2fe" />
  <line x1="112" y1="110" x2="168" y2="110" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Server Unit 3 -->
  <rect x="74" y="130" width="108" height="24" rx="4" fill="#0c1829" stroke="#1e3a5f" stroke-width="1.5" />
  <circle cx="86" cy="142" r="3.5" fill="#00ff88" />
  <circle cx="96" cy="142" r="3.5" fill="#00f2fe" />
  <line x1="112" y1="142" x2="168" y2="142" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Realtime Pulse / Heartbeat Waveform -->
  <path d="M58 172 L92 172 L104 150 L118 196 L132 142 L144 184 L154 172 L198 172"
        fill="none" stroke="url(#pulseGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M58 172 L92 172 L104 150 L118 196 L132 142 L144 184 L154 172 L198 172"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Active Radar Ping Point -->
  <circle cx="132" cy="142" r="4" fill="#00ff88" />
  <circle cx="132" cy="142" r="7.5" fill="#00ff88" opacity="0.45" />
</svg>
