name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/pantau-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/pantau-linux-arm64 .
          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/pantau-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/pantau-windows-arm64.exe .
          cd dist
          tar -czvf pantau-linux-amd64.tar.gz pantau-linux-amd64
          tar -czvf pantau-linux-arm64.tar.gz pantau-linux-arm64
          zip pantau-windows-amd64.zip pantau-windows-amd64.exe
          zip pantau-windows-arm64.zip pantau-windows-arm64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/pantau-linux-amd64.tar.gz
            dist/pantau-linux-arm64.tar.gz
            dist/pantau-windows-amd64.zip
            dist/pantau-windows-arm64.zip
          generate_release_notes: true
