name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build Binaries
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          # Linux amd64
          mkdir -p dist/linux-amd64 && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${TAG}" -o dist/linux-amd64/pantau .
          tar -czvf "dist/pantau-${TAG}-linux-amd64.tar.gz" -C dist/linux-amd64 pantau
          # Linux arm64
          mkdir -p dist/linux-arm64 && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${TAG}" -o dist/linux-arm64/pantau .
          tar -czvf "dist/pantau-${TAG}-linux-arm64.tar.gz" -C dist/linux-arm64 pantau
          # Windows amd64
          mkdir -p dist/windows-amd64 && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${TAG}" -o dist/windows-amd64/pantau.exe .
          (cd dist/windows-amd64 && zip "../pantau-${TAG}-windows-amd64.zip" pantau.exe)
          # Windows arm64
          mkdir -p dist/windows-arm64 && CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${TAG}" -o dist/windows-arm64/pantau.exe .
          (cd dist/windows-arm64 && zip "../pantau-${TAG}-windows-arm64.zip" pantau.exe)

          # Generate SHA-256 checksums
          (cd dist && sha256sum pantau-* > checksums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/pantau-*.tar.gz
            dist/pantau-*.zip
            dist/checksums.txt
          generate_release_notes: true

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
