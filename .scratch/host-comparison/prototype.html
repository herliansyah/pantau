<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROTOTYPE - Pantau Host Comparison UI Variants</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --warning: #eab308;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --gold: #fbbf24;
      --gold-bg: rgba(251, 191, 36, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0b0f19;
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .proto-banner {
      background: #312e81;
      color: #c7d2fe;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    /* Workspace Modal Simulation Container (75vw x 80vh) */
    .workspace-modal-sim {
      width: 75vw;
      min-width: 900px;
      max-width: 1400px;
      height: 80vh;
      min-height: 560px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      position: relative;
    }
    .modal-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
    }
    .modal-header h3 { font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
    .host-selector-bar {
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.3);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .host-pill {
      background: #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .host-pill .remove-btn { cursor: pointer; color: #94a3b8; font-weight: bold; }
    .host-pill .remove-btn:hover { color: #ef4444; }
    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    /* Common UI badges */
    .badge-winner {
      background: var(--gold-bg);
      color: var(--gold);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .cell-winner {
      background: var(--success-bg) !important;
      color: #86efac !important;
      font-weight: 600;
    }
    .cell-stale {
      color: var(--danger) !important;
      opacity: 0.7;
    }

    /* VARIANT A: Unified Matrix Table */
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .matrix-table th, .matrix-table td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      text-align: left;
    }
    .matrix-table th.metric-col { width: 220px; color: var(--text-muted); font-weight: 500; }
    .matrix-category-header {
      background: rgba(15, 23, 42, 0.7);
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .host-summary-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .host-summary-card.overall-winner {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    /* VARIANT B: Card Deck Columns */
    .deck-grid {
      display: grid;
      gap: 16px;
      height: 100%;
    }
    .host-column-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .host-column-card.deck-winner {
      border-color: var(--gold);
    }
    .cat-box {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.4);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.8rem;
    }
    .cat-box-title {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    /* VARIANT C: Executive Podium + Category Tabs */
    .podium-banner {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      justify-content: center;
      align-items: flex-end;
    }
    .podium-slot {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      width: 220px;
    }
    .podium-slot.rank-1 {
      border-color: var(--gold);
      transform: translateY(-8px);
    }
    .v-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }
    .v-tab {
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
    }
    .v-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* Floating Switcher Bar */
    .prototype-switcher-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b4b;
      border: 2px solid #6366f1;
      padding: 8px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      z-index: 9999;
    }
    .switcher-btn {
      background: #4338ca;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .switcher-btn:hover { background: #4f46e5; }
    .switcher-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e0e7ff;
      white-space: nowrap;
    }
  </style>
</head>

    </div>

    <!-- Modal Body with Dynamic Variant Content -->
    <div class="modal-body" id="variantContainer">
      <!-- Injected by JS -->
    </div>
  </div>

            <h5 style="color: var(--accent); margin-bottom: 12px;">📊 Executive Decision Summary:</h5>
            <p style="font-size: 0.9rem; line-height: 1.6; color: #e2e8f0;">
              Berdasarkan evaluasi terhadap 3 Host terpilih, <strong>prod-db-primary</strong> adalah kandidat paling tangguh untuk beban kerja intensif dengan spesifikasi CPU 8-Core dan volume storage 500 GB. Namun, <strong>prod-app-01</strong> menunjukkan efisiensi operasional tertinggi dengan sisa RAM 62.5% dan Lifecycle Score 94. Host <strong>staging-worker</strong> tidak direkomendasikan untuk penambahan beban karena utilisasi memori dan disk telah melampaui batas aman.
            </p>
          </div>
        </div>
      `;
    }

    function renderCurrentVariant() {
      const v = variants[currentVariantIdx];
      document.getElementById("currentVariantLabel").innerText = v.name;
      const container = document.getElementById("variantContainer");
      if (v.key === "A") container.innerHTML = renderVariantA();
      else if (v.key === "B") container.innerHTML = renderVariantB();
      else if (v.key === "C") container.innerHTML = renderVariantC();
    }

    function cycleVariant(delta) {
      currentVariantIdx = (currentVariantIdx + delta + variants.length) % variants.length;
      renderCurrentVariant();
    }

    function copyMarkdownSummary() {
      const md = "# ⚖️ Pantau Host Comparison Summary\\n\\n" +
        "**Host Evaluasi**: `prod-db-primary`, `prod-app-01`, `staging-worker`\\n\\n" +
        "### 🏆 Skor Akhir:\\n" +
        "- **prod-db-primary**: **7 Poin** (Winner — Compute, Storage, Latency)\\n" +
        "- **prod-app-01**: **5 Poin** (Runner-up — Free Memory, Lifecycle Score)\\n" +
        "- **staging-worker**: **1 Poin** (Degraded / Saturation Warning)\\n\\n" +
        "### 💡 Rekomendasi Keputusan:\\n" +
        "> Prioritaskan `prod-db-primary` untuk deployment service kritikal kapasitas besar. `staging-worker` membutuhkan pembersihan disk segera.";
      navigator.clipboard.writeText(md).then(() => {
        alert("Rangkuman Markdown berhasil disalin ke clipboard!");
      });
    }

    // Keyboard shortcut for cycling variants
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") cycleVariant(-1);
      if (e.key === "ArrowRight") cycleVariant(1);
    });

    // Initial render
    renderCurrentVariant();
  </script>
</body>
</html>
